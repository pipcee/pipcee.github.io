<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" role="img" aria-labelledby="avatarTitle avatarDesc">
  <title id="avatarTitle">Bring 的头像插画</title>
  <desc id="avatarDesc">米色背景上，一位戴眼镜、穿深色上衣的年轻人半身像，采用简洁的扁平插画风格。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1e9"/>
      <stop offset="1" stop-color="#eae9e1"/>
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#282a25"/>
      <stop offset="1" stop-color="#1c1e1a"/>
    </linearGradient>
    <clipPath id="portraitClip">
      <rect width="800" height="1000" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#portraitClip)">
    <rect width="800" height="1000" fill="url(#bg)"/>
    <circle cx="645" cy="222" r="214" fill="#e4e8dd" opacity=".9"/>
    <path d="M0 790C127 705 255 681 400 689c156 8 285 58 400 133v178H0V790Z" fill="#dadfd3" opacity=".6"/>

    <g opacity=".35" stroke="#a8a79b" stroke-width="1">
      <path d="M68 88h180"/>
      <path d="M68 98h76"/>
      <path d="M657 866h75"/>
      <path d="M657 878h42"/>
    </g>

    <!-- shoulders / shirt -->
    <path d="M137 1000c11-139 119-238 263-238s252 99 263 238H137Z" fill="url(#shirt)"/>
    <path d="M352 773 400 848l48-75c-17-9-32-14-48-14s-31 5-48 14Z" fill="#e7c1a5"/>
    <path d="M365 818c11 9 23 13 35 13s24-4 35-13l-10-29-25 21-25-21-10 29Z" fill="#f3eee4"/>
    <path d="M379 809c6 6 13 9 21 9s15-3 21-9" fill="none" stroke="#b5b0a3" stroke-width="3" stroke-linecap="round" opacity=".55"/>

    <!-- neck -->
    <path d="M348 663v116c14 18 31 28 52 28s38-10 52-28V663H348Z" fill="#d7a887"/>
    <path d="M348 693c33 30 71 37 104 7v-37H348v30Z" fill="#c69577" opacity=".6"/>

    <!-- ears -->
    <ellipse cx="264" cy="533" rx="30" ry="49" fill="#d7a887"/>
    <ellipse cx="536" cy="533" rx="30" ry="49" fill="#d7a887"/>
    <path d="M262 516c9 6 14 18 15 31" fill="none" stroke="#b78163" stroke-width="4" stroke-linecap="round" opacity=".5"/>
    <path d="M538 516c-9 6-14 18-15 31" fill="none" stroke="#b78163" stroke-width="4" stroke-linecap="round" opacity=".5"/>

    <!-- face -->
    <path d="M279 453c0-117 51-197 121-197s121 80 121 197v87c0 138-57 220-121 220s-121-82-121-220v-87Z" fill="#e5bda2"/>
    <path d="M299 559c30 24 78 32 101 32s71-8 101-32v95c-30 45-67 68-101 68s-71-23-101-68V559Z" fill="#e0b398" opacity=".55"/>

    <!-- hair -->
    <path d="M269 468c-18-135 37-234 133-234 98 0 151 99 128 234-34-19-63-53-76-96-47 43-109 65-185 96Z" fill="#24251f"/>
    <path d="M292 364c27-49 65-80 115-89-61-9-103 19-123 73l8 16Z" fill="#3c3d35" opacity=".7"/>
    <path d="M476 292c32 32 52 73 58 123l-15 11c-12-42-27-75-57-107l14-27Z" fill="#3c3d35" opacity=".45"/>

    <!-- eyebrows -->
    <path d="M318 470c19-12 42-12 58-3" fill="none" stroke="#4f3a2b" stroke-width="7" stroke-linecap="round"/>
    <path d="M424 467c16-9 39-9 58 3" fill="none" stroke="#4f3a2b" stroke-width="7" stroke-linecap="round"/>

    <!-- glasses -->
    <g fill="none" stroke="#20221e" stroke-width="6">
      <rect x="300" y="487" width="93" height="73" rx="28"/>
      <rect x="407" y="487" width="93" height="73" rx="28"/>
      <path d="M393 512c5-7 9-7 14 0"/>
      <path d="M300 505c-17-6-27-14-33-25"/>
      <path d="M500 505c17-6 27-14 33-25"/>
    </g>
    <circle cx="347" cy="526" r="6" fill="#25261f"/>
    <circle cx="455" cy="526" r="6" fill="#25261f"/>
    <path d="M375 535c-5 21-8 37-1 42" fill="none" stroke="#c18d6f" stroke-width="4" stroke-linecap="round" opacity=".65"/>

    <!-- nose + mouth -->
    <path d="M400 560c-7 27-12 45 7 54" fill="none" stroke="#bd886a" stroke-width="5" stroke-linecap="round"/>
    <path d="M362 635c24 17 52 17 76 0" fill="none" stroke="#995f4c" stroke-width="6" stroke-linecap="round"/>
    <path d="M362 640c24 8 52 8 76 0" fill="none" stroke="#ecc9b1" stroke-width="4" stroke-linecap="round" opacity=".7"/>

    <!-- checks -->
    <ellipse cx="315" cy="585" rx="33" ry="16" fill="#d49f86" opacity=".28"/>
    <ellipse cx="485" cy="585" rx="33" ry="16" fill="#d49f86" opacity=".28"/>

    <!-- small identity mark -->
    <g transform="translate(80 902)" opacity=".7">
      <path d="M19 0 0 7.5 6.5 9.8 9 16 12.5 8 19 0Z" fill="#54564d"/>
      <text x="29" y="13" fill="#54564d" font-family="monospace" font-size="13" letter-spacing="3">BRING</text>
    </g>
  </g>
</svg>
